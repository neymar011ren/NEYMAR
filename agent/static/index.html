<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judger Agent · 配置判断器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">Intent → Protocol → Config</p>
          <h1>Judger Agent</h1>
        </div>
      </div>
      <div class="top-actions">
        <div class="meta-inline">
          <span id="meta-model">—</span>
          <span class="dot">·</span>
          <span id="meta-protocol">—</span>
          <span class="dot">·</span>
          <span id="meta-tools">—</span>
        </div>
        <button id="btn-open-settings" class="ghost-btn" type="button">模型配置</button>
        <span id="conn-pill" class="pill">未检测</span>
      </div>
    </header>

    <main class="chat-shell">
      <section class="chat-panel">
        <div id="chat-log" class="chat-log" aria-live="polite"></div>
        <form id="chat-form" class="composer">
          <div class="composer-box">
            <textarea id="chat-input" rows="1" placeholder="把模型配到哪个 Agent？例如：配置金山云到 WorkBuddy"></textarea>
            <div class="composer-actions">
              <button id="btn-send" class="primary-btn" type="submit">发送</button>
            </div>
          </div>
          <div class="composer-foot">
            <button id="btn-clear" class="ghost-btn" type="button">清空对话</button>
            <span>Enter 发送 · Shift+Enter 换行</span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <aside id="settings-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-labelledby="settings-title">
      <div class="drawer-head">
        <div>
          <p class="eyebrow">Live Config</p>
          <h2 id="settings-title">模型与协议配置</h2>
        </div>
        <button class="icon-btn" type="button" data-close aria-label="关闭">×</button>
      </div>
      <form id="settings-form" class="settings-form">
        <label>
          <span>API Base URL</span>
          <input name="api_base_url" placeholder="https://xxx/v1" required />
        </label>
        <label>
          <span>API Key</span>
          <input name="api_key" type="password" placeholder="留空则保持原值" autocomplete="off" />
          <small id="key-hint"></small>
        </label>
        <label>
          <span>模型 ID</span>
          <input name="model" required />
        </label>
        <label>
          <span>接口协议</span>
          <select name="protocol">
            <option value="chat_completions">OpenAI Chat Completions</option>
            <option value="responses">OpenAI Responses</option>
            <option value="anthropic_messages">Anthropic Messages</option>
          </select>
        </label>
        <div class="grid-2">
          <label>
            <span>Temperature</span>
            <input name="temperature" type="number" min="0" max="2" step="0.1" />
          </label>
          <label>
            <span>Max Tokens</span>
            <input name="max_tokens" type="number" min="1" max="200000" step="1" />
          </label>
        </div>
        <label>
          <span>请求超时（秒）</span>
          <input name="request_timeout_seconds" type="number" min="10" max="600" step="1" />
        </label>

        <label class="checkbox">
          <input name="enable_tools" type="checkbox" />
          <span>启用本地工具（判断器工具集 + 文件 + 协议适配）</span>
        </label>
        <small class="field-note">含 detect / probe / write / test_agent_channel 与 protocol_adapt。</small>

        <label class="checkbox">
          <input name="enable_web_search" type="checkbox" />
          <span>启用联网搜索（tools.type = web_search）</span>
        </label>
        <small class="field-note">按金山云文档注入 web_search。参考 docs.ksyun.com/documents/45179</small>

        <label class="checkbox">
          <input name="enable_memory" type="checkbox" />
          <span>启用长期记忆（本地优先，Mem0 可选）</span>
        </label>

        <label>
          <span>记忆用户 ID</span>
          <input name="memory_user_id" placeholder="default" />
        </label>
        <label>
          <span>记忆抽取模型</span>
          <input name="memory_llm_model" placeholder="空则复用主模型" />
        </label>
        <label>
          <span>向量模型 Base URL</span>
          <input name="memory_embed_base_url" placeholder="https://xxx/v1" />
        </label>
        <label>
          <span>向量模型 API Key</span>
          <input name="memory_embed_api_key" type="password" placeholder="留空则保持原值" autocomplete="off" />
          <small id="embed-key-hint"></small>
        </label>
        <label>
          <span>向量模型 ID</span>
          <input name="memory_embed_model" />
        </label>
        <div class="grid-2">
          <label>
            <span>记忆 Top K</span>
            <input name="memory_top_k" type="number" min="1" max="20" />
          </label>
          <label>
            <span>向量维度</span>
            <input name="memory_embed_dims" type="number" min="64" max="4096" />
          </label>
        </div>

        <label>
          <span>系统提示词</span>
          <textarea name="system_prompt" rows="8"></textarea>
        </label>

        <div class="drawer-actions">
          <button id="btn-test" class="ghost-btn" type="button">测试连接</button>
          <button id="btn-list-memory" class="ghost-btn" type="button">查看记忆</button>
          <button id="btn-clear-memory" class="ghost-btn" type="button">清空记忆</button>
          <button class="primary-btn" type="submit">保存配置</button>
        </div>
        <p id="settings-status" class="status-line"></p>
      </form>
    </div>
  </aside>

  <script src="/assets/markdown.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
